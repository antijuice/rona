[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rona"
version = "0.1.0"
description = "Cotranscriptional RNA folding kinetics: real kinetic ensembles, pseudoknot-aware, with time-resolved rendering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rona contributors" }]
keywords = ["RNA", "secondary structure", "kinetics", "cotranscriptional", "pseudoknot", "folding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
movie = ["matplotlib>=3.6", "imageio>=2.25", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7", "ViennaRNA>=2.6"]
all = ["matplotlib>=3.6", "imageio>=2.25", "imageio-ffmpeg>=0.4", "pytest>=7", "ViennaRNA>=2.6"]

[project.scripts]
rona = "rona.cli:main"

[project.urls]
Homepage = "https://github.com/antijuice/rona"
Source = "https://github.com/antijuice/rona"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rona.params" = ["*.par"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
